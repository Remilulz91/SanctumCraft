plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

group = project.maven_group

// Build type: 'public' (default, debug commands OFF) or 'debug' (debug commands ON)
// Usage: ./gradlew build                   -> public build
//        ./gradlew build -PbuildType=debug -> debug build (separate JAR with -debug suffix)
def buildType = project.findProperty('buildType') ?: 'public'

version = buildType == 'debug'
        ? "${project.mod_version}-debug"
        : project.mod_version

base {
    archivesName = project.archives_base_name
}

println "==> Building SanctumCraft v${version} (type: ${buildType})"

repositories {
    mavenCentral()
    // Optional integrations: Mod Menu (config button) and Cloth Config (config screen).
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
}

// Fixed dev username: without it, "gradlew runClient" uses a random PlayerXXX each launch,
// so a new UUID and an empty Hunter profile (Shells, companions...) every time.
loom {
    runs {
        client {
            programArgs "--username", "Remilulz_91"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional: not bundled, not required. Present in runClient for testing.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "buildType", buildType

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }

    filesMatching("sanctumcraft.build.properties") {
        expand "build_type": buildType,
                "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
